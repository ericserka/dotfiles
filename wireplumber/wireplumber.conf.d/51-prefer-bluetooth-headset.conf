# Prefer Bluetooth headsets (e.g. JBL Tune 720BT) for both output and input.
# Built-in ALSA nodes have session priorities around 1000, so they become the
# automatic fallback whenever no Bluetooth headset is connected.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
]

# Use the wideband mSBC codec for the headset microphone (HFP) when supported,
# instead of the narrowband CVSD fallback.
monitor.bluez.properties = {
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}
